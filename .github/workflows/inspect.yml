name: Inspect API
on: workflow_dispatch
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 21}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: 9.2.0}
      - run: gradle build --no-daemon -q
      - run: |
          echo "@@@JAR"; unzip -l build/libs/serpent-wand-1.0.0.jar | grep -vE "assets/"
          echo "@@@MIXINJSON"; unzip -p build/libs/serpent-wand-1.0.0.jar bonewand.mixins.json
          echo "@@@MIXINCLASS"; unzip -p build/libs/serpent-wand-1.0.0.jar com/bonewand/mixin/PlayerEntityModelMixin.class > /tmp/M.class; strings /tmp/M.class | grep -iE "class_|method_|setAngles" | head
