name: Inspect API
on: workflow_dispatch
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 21}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: 9.2.0}
      - run: gradle build --no-daemon -q
      - run: |
          J=$(find ~/.gradle -path "*minecraftMaven/net/minecraft/minecraft-merged/*" -name "*.jar" | head -1)
          echo "@@@HELD"; javap -p -cp "$J" net.minecraft.client.render.item.HeldItemRenderer | grep -E "\(" | grep -vE "static final"
          echo "@@@ARMPOSE"; javap -p -cp "$J" 'net.minecraft.client.render.entity.model.BipedEntityModel$ArmPose' | head -30
          echo "@@@ARMPOSING"; javap -p -cp "$J" net.minecraft.client.render.entity.model.ArmPosing
          echo "@@@PAYLOAD"; javap -p -cp "$J" net.minecraft.network.packet.CustomPayload | head -20
