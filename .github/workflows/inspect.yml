name: Inspect API
on: workflow_dispatch
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 21}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: 9.2.0}
      - run: gradle build --no-daemon -q
      - run: |
          J=$(find ~/.gradle -path "*minecraftMaven/net/minecraft/minecraft-merged/*" -name "*.jar" | head -1)
          echo "@@@SLEEVE"; javap -p -c -cp "$J" net.minecraft.client.render.entity.model.PlayerEntityModel | grep -E "setAngles\(net.minecraft.client.render.entity.state.PlayerEntityRenderState\)|copyTransform|addChild|Sleeve" | head -30
          echo "@@@REFMAP"; unzip -l build/libs/serpent-wand-1.0.0.jar | grep -iE "refmap|mixins"; unzip -p build/libs/serpent-wand-1.0.0.jar serpent-wand-refmap.json 2>/dev/null | head -40
