name: Inspect API
on: workflow_dispatch
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 21}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: 9.2.0}
      - run: gradle build --no-daemon -q
      - run: |
          J=$(find ~/.gradle -path "*minecraftMaven/net/minecraft/minecraft-merged/*" -name "*.jar" | head -1); echo "JAR=$J"
          unzip -l "$J" | awk '{print $4}' | grep -E "(HeldItemRenderer|BipedEntityModel|PlayerEntityModel|BipedEntityRenderState|PlayerEntityRenderState|PlayerEntityRenderer|ArmPosing|ArmedEntityRenderState|LivingEntityRenderState|ItemUseAnimation|UseAction)\.class$" > /tmp/classes.txt; cat /tmp/classes.txt
          for f in $(cat /tmp/classes.txt); do c=$(echo ${f%.class} | tr / .); echo "=== $c"; javap -p -cp "$J" $c 2>&1 | head -90; done
