name: Inspect API
on: workflow_dispatch
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 21}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: 9.2.0}
      - run: gradle build --no-daemon -q
      - run: |
          find ~/.gradle /home/runner/work -name "*.jar" 2>/dev/null | grep -iE "minecraft" | head -20
          J=$(find ~/.gradle -name "*.jar" | grep -iE "minecraft-(merged|client).*(named|yarn|mapped)|minecraft-merged" | head -1); echo "JAR=$J"
          for c in net.minecraft.client.render.item.HeldItemRenderer net.minecraft.client.render.entity.model.BipedEntityModel net.minecraft.client.render.entity.model.PlayerEntityModel net.minecraft.client.render.entity.state.BipedEntityRenderState net.minecraft.client.render.entity.state.PlayerEntityRenderState net.minecraft.client.render.entity.PlayerEntityRenderer net.minecraft.client.render.entity.model.ArmPosing; do echo "=== $c"; javap -p -cp "$J" $c 2>&1 | head -80; done
